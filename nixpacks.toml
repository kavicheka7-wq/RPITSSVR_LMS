providers = ["php"]

[variables]
PHP_VERSION = "8.4"

[phases.build]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "mkdir -p storage/app/public/profiles storage/app/public/lessons storage/app/public/assignments storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
    "chmod -R 777 storage bootstrap/cache"
]

[start]
cmd = "php artisan config:clear && php artisan route:clear && php artisan storage:link --force && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"